<svg width="1200" height="630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#050a10;stop-opacity:1" />
      <stop offset="55%" style="stop-color:#07131a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#06202b;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#34d399;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#06b6d4;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0891b2;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGradient)"/>

  <!-- Blobs -->
  <circle cx="100" cy="80" r="150" fill="#10b981" opacity="0.10" filter="url(#glow)"/>
  <circle cx="1100" cy="550" r="200" fill="#0891b2" opacity="0.10" filter="url(#glow)"/>
  <circle cx="600" cy="150" r="100" fill="#22d3ee" opacity="0.05"/>

  <!-- Left decorative card -->
  <rect x="40" y="120" width="240" height="390" rx="25" fill="#ffffff" opacity="0.05" stroke="#10b981" stroke-width="2"/>

  <!-- Marca: quatro caixas (estoque) -->
  <g filter="url(#glow)" transform="translate(90, 245)">
    <rect x="0"   y="0"   width="65" height="65" rx="14" fill="#34d399"/>
    <rect x="75"  y="0"   width="65" height="65" rx="14" fill="#10b981"/>
    <rect x="0"   y="75"  width="65" height="65" rx="14" fill="#06b6d4"/>
    <rect x="75"  y="75"  width="65" height="65" rx="14" fill="#0891b2"/>
  </g>

  <!-- Titulo -->
  <text x="370" y="150" font-family="Segoe UI, Arial, sans-serif" font-size="76" font-weight="900" fill="white" letter-spacing="-2">
    Estoque &amp; Vendas
  </text>

  <!-- Subtitulo -->
  <rect x="370" y="192" width="8" height="50" rx="4" fill="url(#accentGrad)"/>
  <text x="395" y="232" font-family="Segoe UI, Arial, sans-serif" font-size="40" font-weight="600" fill="#34d399" letter-spacing="0.5">
    Controle do seu negócio
  </text>

  <!-- Features -->
  <g>
    <circle cx="370" cy="310" r="8" fill="#10b981"/>
    <text x="400" y="320" font-family="Segoe UI, Arial, sans-serif" font-size="20" fill="#ffffff" font-weight="500">
      Controle de estoque com histórico de entradas e saídas
    </text>

    <circle cx="370" cy="380" r="8" fill="#10b981"/>
    <text x="400" y="390" font-family="Segoe UI, Arial, sans-serif" font-size="20" fill="#ffffff" font-weight="500">
      Vendas com baixa automática e margem calculada
    </text>

    <circle cx="370" cy="450" r="8" fill="#10b981"/>
    <text x="400" y="460" font-family="Segoe UI, Arial, sans-serif" font-size="20" fill="#ffffff" font-weight="500">
      Relatórios de lucro, top produtos e estoque baixo
    </text>
  </g>

  <!-- CTA -->
  <g filter="url(#glow)">
    <rect x="370" y="510" width="760" height="90" rx="20" fill="url(#accentGrad)" stroke="#34d399" stroke-width="3"/>
    <text x="750" y="568" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="700" fill="#04231c" text-anchor="middle">
      2 meses grátis • Sem cartão de crédito
    </text>
  </g>

  <line x1="370" y1="628" x2="1130" y2="628" stroke="#10b981" stroke-width="3" opacity="0.6"/>
</svg>
